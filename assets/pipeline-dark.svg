<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.bar{transform-box:fill-box;transform-origin:center;animation:breathe 4.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.bar,.flow{animation:none}}
</style>
<rect x="0.5" y="0.5" width="999" height="209" rx="14" fill="#151b23" stroke="#2a3441"/>
<text x="40" y="44" font-size="15" font-weight="600" fill="#e8edf3">How the classifier works</text>
<text x="40" y="66" font-size="13" fill="#95a3b5">Simplified signal flow, from sound to decision</text>
<rect x="40.0" y="98" width="134" height="80" rx="10" fill="#0d1117" stroke="#2a3441"/>
<text x="107.0" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#e8edf3">Microphone</text>
<text x="107.0" y="154" font-size="12" text-anchor="middle" fill="#95a3b5">environmental audio</text>
<line class="flow" x1="178.0" y1="138.0" x2="189.2" y2="138.0" stroke="#6aa6ff" stroke-width="2" stroke-linecap="round"/>
<rect x="193.2" y="98" width="134" height="80" rx="10" fill="#0d1117" stroke="#2a3441"/>
<text x="260.2" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#e8edf3">Analog front-end</text>
<text x="260.2" y="154" font-size="12" text-anchor="middle" fill="#95a3b5">custom circuit</text>
<line class="flow" x1="331.2" y1="138.0" x2="342.4" y2="138.0" stroke="#6aa6ff" stroke-width="2" stroke-linecap="round"/>
<rect x="346.4" y="98" width="134" height="80" rx="10" fill="#0d1117" stroke="#2a3441"/>
<text x="413.4" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#e8edf3">ADC</text>
<text x="413.4" y="154" font-size="12" text-anchor="middle" fill="#95a3b5">digitize signal</text>
<line class="flow" x1="484.4" y1="138.0" x2="495.6" y2="138.0" stroke="#6aa6ff" stroke-width="2" stroke-linecap="round"/>
<rect x="499.6" y="98" width="134" height="80" rx="10" fill="#0d1117" stroke="#2a3441"/>
<text x="566.6" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#e8edf3">FFT and DSP</text>
<text x="566.6" y="154" font-size="12" text-anchor="middle" fill="#95a3b5">spectrogram</text>
<line class="flow" x1="637.6" y1="138.0" x2="648.8" y2="138.0" stroke="#6aa6ff" stroke-width="2" stroke-linecap="round"/>
<rect x="652.8" y="98" width="134" height="80" rx="10" fill="#0d1117" stroke="#2a3441"/>
<text x="719.8" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#e8edf3">TinyML model</text>
<text x="719.8" y="154" font-size="12" text-anchor="middle" fill="#95a3b5">runs on-device</text>
<line class="flow" x1="790.8" y1="138.0" x2="802.0" y2="138.0" stroke="#6aa6ff" stroke-width="2" stroke-linecap="round"/>
<rect x="806.0" y="98" width="134" height="80" rx="10" fill="#6aa6ff" stroke="#6aa6ff"/>
<text x="873.0" y="132" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">Prediction</text>
<text x="873.0" y="154" font-size="12" text-anchor="middle" fill="#0d1117">sound class</text>
</svg>
